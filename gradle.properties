# Memory and JVM daemon options
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin compiler daemon options
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseG1GC

# Parallel build execution across modules
org.gradle.parallel=true

# Build output caching
org.gradle.caching=true

# Configuration phase caching
org.gradle.configuration-cache=true

# File system watching
org.gradle.vfs.watch=true

# Incremental compilation for Kotlin and Multiplatform
kotlin.incremental=true
kotlin.incremental.multiplatform=true

# Android Gradle Plugin optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
